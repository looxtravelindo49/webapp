<!doctype html>
<!--
  Sumber gambar bagikan bawaan (static/og-default.png, 1200x630). Buat ulang dengan tangkapan layar Chromium
  berukuran 1200x630 dari berkas ini (lihat bagian SEO di README).
-->
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Montserrat';
				src: url('../node_modules/@fontsource-variable/montserrat/files/montserrat-latin-wght-normal.woff2') format('woff2');
				font-weight: 100 900;
			}
			* { box-sizing: border-box; margin: 0; }
			html, body { width: 1200px; height: 630px; overflow: hidden; }
			body { position: relative; background: #113a33; color: #fff; font-family: 'Montserrat', Arial, sans-serif; }
			.art { position: absolute; inset: 0 0 0 auto; width: 520px; }
			.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
			.art::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 140px; background: linear-gradient(90deg, #113a33, rgb(17 58 51 / 0)); z-index: 1; }
			.copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; }
			.eyebrow { color: #f3d284; font-size: 20px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; }
			h1 { margin-top: 28px; font-size: 92px; line-height: 1; letter-spacing: -0.06em; font-weight: 900; }
			h1 span { font-weight: 500; }
			p { margin-top: 34px; max-width: 520px; font-size: 28px; line-height: 1.45; color: #e7efec; }
			.bar { margin-top: 44px; width: 96px; height: 8px; border-radius: 4px; background: #f3d284; }
		</style>
	</head>
	<body>
		<div class="art"><img src="../static/media/forest.svg" alt="" /></div>
		<div class="copy">
			<div class="eyebrow">by Loox Travel</div>
			<h1>Lembang <span>Adventures</span></h1>
			<p>Offroad, team building, rafting, paintball, dan fun games untuk timmu.</p>
			<div class="bar"></div>
		</div>
	</body>
</html>
